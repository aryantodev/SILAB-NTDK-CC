[PHP]
; PHP Configuration for Laravel Production

; Basic settings
memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 100M
post_max_size = 100M
max_input_vars = 5000

; Display errors (disable in production)
display_errors = Off
log_errors = On
error_log = /var/log/php-fpm/error.log

; Date timezone
date.timezone = Asia/Jakarta

; Database
mysqli.default_socket = /var/run/mysqld/mysqld.sock

; Session
session.save_handler = files
session.save_path = /app/storage/framework/sessions
session.gc_maxlifetime = 21600

; Extensions
extension = pdo_mysql
extension = mbstring
extension = json
extension = bcmath
extension = zip
extension = curl
